name: Deploy Studio Hub
on:
  push:
    branches: [main]
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ubuntu
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: COBALT_API_KEY
          script: |
            cd ~/studio_app
            git pull origin main
            sudo apt-get install -y ffmpeg 2>/dev/null || true
            source venv/bin/activate && pip install -U yt-dlp pysocks yt-dlp-youtube-oauth2 google-genai

            # Cloudflare WARP 설치 (최초 1회, 올바른 도메인: pkg.cloudflareclient.com)
            if ! command -v warp-cli > /dev/null 2>&1; then
              curl -fsSL https://pkg.cloudflareclient.com/pubkey.gpg | sudo gpg --yes --dearmor --output /usr/share/keyrings/cloudflare-warp-archive-keyring.gpg
              echo "deb [signed-by=/usr/share/keyrings/cloudflare-warp-archive-keyring.gpg] https://pkg.cloudflareclient.com/ $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/cloudflare-client.list
              sudo apt-get update -qq && sudo apt-get install -y cloudflare-warp
              warp-cli --accept-tos registration new
              warp-cli mode proxy
              warp-cli proxy port 40000
              warp-cli connect
            fi
            sudo systemctl start warp-svc 2>/dev/null || true
            warp-cli connect 2>/dev/null || true

            # COBALT_API_KEY를 systemd 서비스 환경변수에 저장
            if [ -n "$COBALT_API_KEY" ]; then
              sudo mkdir -p /etc/systemd/system/studio-hub.service.d
              printf '[Service]\nEnvironment="COBALT_API_KEY=%s"\n' "$COBALT_API_KEY" | sudo tee /etc/systemd/system/studio-hub.service.d/cobalt.conf > /dev/null
              sudo systemctl daemon-reload
            fi

            sudo systemctl restart studio-hub
        env:
          COBALT_API_KEY: ${{ secrets.COBALT_API_KEY }}
