name: Deploy Studio Hub
on:
  push:
    branches: [main]
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ubuntu
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: COBALT_API_KEY
          script: |
            cd ~/studio_app
            git pull origin main
            source venv/bin/activate && pip install -U yt-dlp pysocks yt-dlp-youtube-oauth2

            # COBALT_API_KEY를 systemd 서비스 환경변수에 저장
            if [ -n "$COBALT_API_KEY" ]; then
              sudo mkdir -p /etc/systemd/system/studio-hub.service.d
              printf '[Service]\nEnvironment="COBALT_API_KEY=%s"\n' "$COBALT_API_KEY" | sudo tee /etc/systemd/system/studio-hub.service.d/cobalt.conf > /dev/null
              sudo systemctl daemon-reload
            fi

            sudo systemctl restart studio-hub
        env:
          COBALT_API_KEY: ${{ secrets.COBALT_API_KEY }}
